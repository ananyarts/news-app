{% extends 'news/base.html' %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="panel">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button>Log in</button>
  <p>No account? <a href="{% url 'register' %}">Sign up</a></p>
</form>
{% endblock %}
