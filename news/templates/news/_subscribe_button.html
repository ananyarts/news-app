{% if user.is_reader %}
<form method="post" action="{% url 'toggle_subscription' kind pk %}" class="inline">
  {% csrf_token %}
  <button class="{% if subscribed %}secondary{% endif %}">{% if subscribed %}Unsubscribe{% else %}Subscribe{% endif %}</button>
</form>
{% elif not user.is_authenticated %}
<a class="button" href="{% url 'login' %}?next={{ request.path }}">Log in to subscribe</a>
{% endif %}
